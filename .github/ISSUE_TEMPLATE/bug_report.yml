name: Bug report
description: Report a reproducible problem in the application.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve DevOps Compass.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      placeholder: "1. Open...\n2. Select...\n3. See..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Application language
      options: ["English", "Polish"]
  - type: textarea
    id: context
    attributes:
      label: Additional context
